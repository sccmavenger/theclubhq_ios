<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're invited to a team on ClubHQ</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0B1E3A">
  <meta property="og:title" content="You're invited to a team on ClubHQ">
  <meta property="og:description" content="Tap to join — schedules, RSVPs, and team chat in one ad-free app.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ClubHQ">
  <meta property="og:image" content="https://teamclubhq.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <!--
    Served for /join/<token> (see _redirects). With the app installed and Universal Links
    configured (.well-known/apple-app-site-association), iOS opens the app directly and this
    page is never shown. Otherwise it offers to open the app or install it.
  -->
  <main class="wrap">
    <section class="hero">
      <img class="icon" src="/assets/icon-1024.png" alt="ClubHQ app icon">
      <h1>You're invited to join a team</h1>
      <p class="lead">Your coach uses ClubHQ for the schedule, RSVPs, and team chat. Open the invite in the app to add your child.</p>
      <div class="btns">
        <a class="btn" id="open" href="clubhq://join">Open in ClubHQ</a>
        <a class="btn secondary" id="get" href="/download">Get the app</a>
      </div>
      <div class="card">
        <p class="muted" style="margin:0 0 8px">Already have the app? Choose <b>I'm a parent or guardian</b> and paste this invite code:</p>
        <code class="token" id="token">—</code>
      </div>
    </section>
    <footer class="site">
      <a href="/">ClubHQ</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/support">Support</a>
    </footer>
  </main>
  <script>
    // The token is the last path segment: /join/<token>. Tokens are URL-safe base64.
    const token = (location.pathname.split("/").filter(Boolean)[1] || "").replace(/[^A-Za-z0-9_-]/g, "");
    if (token) {
      document.getElementById("token").textContent = token;
      document.getElementById("open").href = "clubhq://join/" + token;
      // Copy the invite before the App Store detour, so after installing, ClubHQ can offer
      // "Paste" on its first screen instead of the parent hunting for the text again.
      document.getElementById("get").addEventListener("click", function (e) {
        if (!navigator.clipboard) return;
        e.preventDefault();
        const go = function () { location.href = "/download"; };
        navigator.clipboard.writeText(location.origin + "/join/" + token).then(go, go);
      });
    }
  </script>
</body>
</html>
