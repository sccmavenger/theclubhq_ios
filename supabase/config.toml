project_id = "teamclubhq"

# Function-level settings for the ClubHQ mobile backend. Merge these blocks into the
# web repo's supabase/config.toml (project_id lives there).

[functions.mobile-api]
verify_jwt = true

# Webhooks authenticate with their own signatures / secrets, not Supabase JWTs.
[functions.stripe-webhook]
verify_jwt = false

[functions.appstore-notifications]
verify_jwt = false

[functions.apns-dispatch]
verify_jwt = false
