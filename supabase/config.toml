project_id = "teamclubhq"

# Function-level settings for the ClubHQ backend (TeamClubHQ project, D-028).

[functions.mobile-api]
verify_jwt = true

# Webhooks authenticate with their own signatures / secrets, not Supabase JWTs.
[functions.stripe-webhook]
verify_jwt = false

[functions.appstore-notifications]
verify_jwt = false

[functions.apns-dispatch]
verify_jwt = false

# Calendar apps can't send a JWT; the secret feed token is the credential (D-036).
[functions.calendar-feed]
verify_jwt = false

# Admin portal writes (D-041). JWT required; admin role + MFA are checked again inside.
[functions.admin-api]
verify_jwt = true

[functions.scheduled-jobs]
verify_jwt = false
